[project]
name = "software-project-audit-dev"
version = "0.0.0"
requires-python = ">=3.9"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
markers = ["docker: needs a running Docker daemon", "hostrun: creates venvs or node_modules and needs network",
           "agentcli: runs the claude or codex CLI; skipped when it is not installed"]
testpaths = ["tests"]
pythonpath = ["software-project-audit/skills/audit/scripts"]
